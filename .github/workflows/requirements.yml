name: Requirements documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test documentation synchronization
        run: npm run docs:test
      - name: Check requirements and reviewed website baseline
        run: npm run docs:check
