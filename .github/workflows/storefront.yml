name: Storefront browser regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:purchase
      - run: npm run test:ui
      - run: npm run test:catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-results
          path: test-results/
          retention-days: 7
